name: V25 L4C Authorized Surgical Mutation Gate
on:
  workflow_dispatch:
  push:
    branches: [feature/gd4-v25-l4c-authorized-surgical-mutation]
permissions: {contents: read}
jobs:
  l4c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Materialize locked stages through L4B
        run: |
          cd v22-runtime
          python scripts/v23/bootstrap_v23_payload.py
          python scripts/v23/apply_v23_runtime_corrections.py
          cd ..
          python v24-runtime/materialize_v24_compact.py
          python v24-runtime/assert_v24_canonicalization.py
          python v25-runtime/materialize_v25_l2.py
          python v25-runtime/materialize_v25_l3.py
          python v25-runtime/materialize_v25_l4a.py
          python v25-runtime/materialize_v25_l4b.py --production-only
      - name: Generate canonical fixtures
        working-directory: v22-runtime
        run: |
          python scripts/v22/generate_docx_fixtures.py
          python scripts/v22/normalize_generated_fixtures.py
          python scripts/v23/generate_semantic_fixtures.py
      - name: Intent RED tests
        run: python v25-runtime/materialize_v25_l4c.py --intent-tests-only
      - name: Restore
        working-directory: v22-runtime
        run: dotnet restore DocumentEngine.slnx
      - name: Prove authority RED
        id: red_intent
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V25L4CIntentTests
      - name: Enforce authority RED
        run: test "${{ steps.red_intent.outcome }}" = "failure"
      - name: Materialize exact intent production
        run: python v25-runtime/materialize_v25_l4c.py --intent-production-only
      - name: Exact intent GREEN
        id: intent_green
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V25L4CIntentTests
      - name: Executor RED tests
        run: python v25-runtime/materialize_v25_l4c.py --executor-tests-only
      - name: Prove executor RED
        id: red_executor
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V25L4CMutationTests
      - name: Enforce executor RED
        run: test "${{ steps.red_executor.outcome }}" = "failure"
      - name: Materialize executor production
        run: python v25-runtime/materialize_v25_l4c.py --executor-production-only
      - name: Build
        id: build
        working-directory: v22-runtime
        run: dotnet build DocumentEngine.slnx -c Release
      - name: L4C targeted GREEN
        id: targeted
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj --no-build -c Release --filter 'FullyQualifiedName~V25L4CIntentTests|FullyQualifiedName~V25L4CMutationTests' --logger 'console;verbosity=detailed'
      - name: Full regression
        id: regression
        working-directory: v22-runtime
        run: dotnet test DocumentEngine.slnx --no-build -c Release --logger 'trx;LogFileName=v25-l4c-tests.trx' --logger 'console;verbosity=detailed'
      - name: Static authority and write boundary
        id: static
        working-directory: v22-runtime
        run: |
          python scripts/v22/audit_v22_static.py
          python scripts/v23/audit_v23_static.py
          python scripts/v24/audit_v24_static.py
          ! grep -R -E 'SaveAs|\.Save\(|WriteAll|OpenWrite|FileMode.Create|File\.Replace|WordprocessingDocument.Open.*true' src/LegalValidator/State src/LegalValidator/Remediation src/LegalValidator/Authorization
          grep -q 'WordprocessingDocument.Open(tmp,true)' src/LegalValidator/Mutation/ParagraphAlignmentMutationExecutor.cs
          ! grep -R -E 'RuleCatalog|ProposedValue|finding.Expected' src/LegalValidator/Mutation
          grep -q 'PatchPolicy.NORMAL' src/LegalValidator/Mutation/ParagraphAlignmentMutationExecutor.cs
          grep -q 'PROVENANCE_NOT_DIRECT' src/LegalValidator/Mutation/ParagraphAlignmentMutationExecutor.cs
      - name: Package tested source
        id: package
        working-directory: v22-runtime
        run: |
          rm -rf src/*/bin src/*/obj tests/*/bin tests/*/obj
          find . -type d -name TestResults -prune -exec rm -rf {} +
          zip -qr ../v25-l4c-runtime-tested-source.zip . -x '.v23-payload/*'
          sha256sum ../v25-l4c-runtime-tested-source.zip > ../v25-l4c-runtime-tested-source.zip.sha256
          sha256sum -c ../v25-l4c-runtime-tested-source.zip.sha256
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25-l4c-results
          path: |
            v22-runtime/**/TestResults/**
            v25-l4c-runtime-tested-source.zip
            v25-l4c-runtime-tested-source.zip.sha256
          if-no-files-found: warn
      - name: Enforce gate
        if: always()
        run: |
          echo "intent_red=${{ steps.red_intent.outcome }} intent_green=${{ steps.intent_green.outcome }} executor_red=${{ steps.red_executor.outcome }} build=${{ steps.build.outcome }} targeted=${{ steps.targeted.outcome }} regression=${{ steps.regression.outcome }} static=${{ steps.static.outcome }} package=${{ steps.package.outcome }}"
          test "${{ steps.red_intent.outcome }}" = failure
          test "${{ steps.intent_green.outcome }}" = success
          test "${{ steps.red_executor.outcome }}" = failure
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.targeted.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
          test "${{ steps.static.outcome }}" = success
          test "${{ steps.package.outcome }}" = success