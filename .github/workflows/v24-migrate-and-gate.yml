name: V24 Migrate And Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v24-migrate-and-gate.yml'

permissions:
  contents: write

env:
  SOURCE_REPO: thanhhaixn92/chuan-hoa-van-ban-nghi-dinh-30
  SOURCE_REF: feature/gd4-v24-validator-runtime
  TARGET_BRANCH: feature/gd4-v24-validator-runtime

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream v24 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: upstream-v24
          fetch-depth: 1

      - name: Patch native V24 workflow with PyYAML dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('upstream-v24/.github/workflows/v24-validator-gate.yml')
          s = p.read_text(encoding='utf-8')
          marker = "      - name: Show toolchain\n"
          step = """      - name: Install Python audit dependency\n        run: |\n          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3\n          python -c \"import yaml; print('PyYAML', yaml.__version__)\"\n\n"""
          if 'Install Python audit dependency' not in s:
              if marker not in s:
                  raise SystemExit('workflow patch marker not found')
              s = s.replace(marker, step + marker, 1)
              p.write_text(s, encoding='utf-8')
          print('native v24 workflow patched for PyYAML')
          PY

      - name: Verify expected upstream V24 payload files
        shell: bash
        run: |
          test -f upstream-v24/v24-runtime/materialize_v24_compact.py
          test -f upstream-v24/v22-runtime/scripts/v24/audit_v24_static.py
          test -f upstream-v24/.github/workflows/v24-validator-gate.yml
          grep -q 'PyYAML==6.0.3' upstream-v24/.github/workflows/v24-validator-gate.yml

      - name: Publish migrated V24 branch to fork
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch "$TARGET_BRANCH"
          rsync -a --delete --exclude '.git' upstream-v24/ ./
          rm -rf upstream-v24
          git add -A
          git commit -m 'GĐ4 v24: migrate runtime source and fix PyYAML CI dependency'
          git push origin "$TARGET_BRANCH"

      - name: Verify published branch ref
        shell: bash
        run: git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH"
