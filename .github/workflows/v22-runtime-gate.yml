name: V22 Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gd3-v22-runtime-gate

permissions:
  contents: read
  issues: write

jobs:
  v22-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show toolchain
        working-directory: v22-runtime
        run: |
          dotnet --info
          dotnet --list-sdks
          python --version

      - name: Generate deterministic DOCX fixtures
        working-directory: v22-runtime
        run: |
          python scripts/v22/generate_docx_fixtures.py
          python scripts/v22/normalize_generated_fixtures.py

      - name: Static V22 audit
        working-directory: v22-runtime
        run: python scripts/v22/audit_v22_static.py

      - name: Restore
        id: restore
        continue-on-error: true
        working-directory: v22-runtime
        run: |
          set -o pipefail
          dotnet restore DocumentEngine.slnx 2>&1 | tee restore.log

      - name: Build
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: v22-runtime
        run: |
          set -o pipefail
          dotnet build DocumentEngine.slnx --no-restore -c Release 2>&1 | tee build.log

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: v22-runtime
        run: |
          set -o pipefail
          dotnet test DocumentEngine.slnx --no-build -c Release --logger "trx;LogFileName=v22-tests.trx" --logger "console;verbosity=detailed" 2>&1 | tee test.log

      - name: Final static regression
        if: steps.test.outcome == 'success'
        working-directory: v22-runtime
        run: python scripts/v22/audit_v22_static.py

      - name: Publish diagnostics issue
        if: steps.restore.outcome != 'success' || steps.build.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const base = path.join(process.env.GITHUB_WORKSPACE, 'v22-runtime');
            const parts = [];
            for (const f of ['restore.log','build.log','test.log']) {
              const p = path.join(base, f);
              if (fs.existsSync(p)) {
                let t = fs.readFileSync(p, 'utf8');
                if (t.length > 50000) t = t.slice(-50000);
                parts.push(`## ${f}\n\n\`\`\`text\n${t}\n\`\`\``);
              }
            }
            const body = `Commit: ${context.sha}\nRun: ${context.runId}\n\n` + parts.join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `V22 Runtime Gate diagnostics ${context.sha.substring(0,7)}`,
              body
            });

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-runtime-results
          path: |
            v22-runtime/**/TestResults/**
            v22-runtime/*.log
          if-no-files-found: warn

      - name: Enforce gate
        if: always()
        run: |
          echo "restore=${{ steps.restore.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"
          test "${{ steps.restore.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
