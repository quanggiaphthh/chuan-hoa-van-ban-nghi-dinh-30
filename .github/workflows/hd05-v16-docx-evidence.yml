name: HD05 V16 DOCX evidence probes

on:
  push:
    branches:
      - feature/hd05-v16-docx-observation-probes
  pull_request:
    paths:
      - 'v22-runtime/src/DocumentEngine/Formatting/DocxObservationProbes.cs'
      - 'v22-runtime/tests/DocumentEngine.Tests/DocxObservationProbesTests.cs'
      - '.github/workflows/hd05-v16-docx-evidence.yml'

permissions:
  contents: read

concurrency:
  group: hd05-v16-docx-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET solution
        run: dotnet restore v22-runtime/DocumentEngine.slnx
      - name: Build .NET solution
        run: dotnet build v22-runtime/DocumentEngine.slnx --no-restore -c Release
      - name: Focused real DOCX evidence tests
        run: dotnet test v22-runtime/tests/DocumentEngine.Tests/DocumentEngine.Tests.csproj --no-build -c Release --filter FullyQualifiedName~DocxObservationProbesTests --logger "trx;LogFileName=hd05-v16-evidence.trx"
      - name: Entire .NET regression
        run: dotnet test v22-runtime/DocumentEngine.slnx --no-build -c Release --logger "trx;LogFileName=hd05-v16-regression.trx"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd05-v16-docx-evidence
          path: v22-runtime/tests/*/TestResults/*.trx
          if-no-files-found: warn
