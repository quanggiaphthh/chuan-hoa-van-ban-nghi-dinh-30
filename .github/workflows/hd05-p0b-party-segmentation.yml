name: HD05 P0-B Party source-order segmentation

on:
  push:
    branches:
      - feature/hd05-p0b-party-source-order-segmentation
  pull_request:
    paths:
      - 'v22-runtime/src/SemanticDetector/**'
      - 'v22-runtime/tests/SemanticDetector.Tests/**'
      - '.github/workflows/hd05-p0b-party-segmentation.yml'

permissions:
  contents: read

concurrency:
  group: hd05-p0b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  party-segmentation-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore v22-runtime/DocumentEngine.slnx
      - name: Build
        run: dotnet build v22-runtime/DocumentEngine.slnx --no-restore -c Release
      - name: Focused Party boundary tests
        run: dotnet test v22-runtime/tests/SemanticDetector.Tests/SemanticDetector.Tests.csproj --no-build -c Release --filter FullyQualifiedName~PartySourceOrderSegmenterTests --logger "trx;LogFileName=p0b.trx"
      - name: Full solution regression including administrative behavior
        run: dotnet test v22-runtime/DocumentEngine.slnx --no-build -c Release --logger "trx;LogFileName=p0b-regression.trx"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd05-p0b-dotnet-evidence
          path: v22-runtime/tests/*/TestResults/*.trx
          if-no-files-found: warn
