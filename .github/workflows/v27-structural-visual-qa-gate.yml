name: V27 Structural Visual QA Gate
on: {workflow_dispatch: {}, push: {branches: [feature/gd4-v27-structural-visual-qa]}}
permissions: {contents: read}
jobs:
  v27:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Materialize locked V22-V26
        run: |
          git merge-base --is-ancestor f55d82be4657f9da6bee594325d2cccb26c995ff HEAD
          cd v22-runtime && python scripts/v23/bootstrap_v23_payload.py && python scripts/v23/apply_v23_runtime_corrections.py && cd ..
          python v24-runtime/materialize_v24_compact.py && python v24-runtime/assert_v24_canonicalization.py
          python v25-runtime/materialize_v25_l2.py && python v25-runtime/materialize_v25_l3.py && python v25-runtime/materialize_v25_l4a.py && python v25-runtime/materialize_v25_l4b.py
          python v25-runtime/correct_v25_l4c_test_default.py && python v25-runtime/materialize_v25_l4c.py
          cd v22-runtime && python scripts/v22/generate_docx_fixtures.py && python scripts/v22/normalize_generated_fixtures.py && python scripts/v23/generate_semantic_fixtures.py && cd ..
          python v26-runtime/materialize_v26_foundation.py && python v26-runtime/correct_v26_foundation.py
          python v26-runtime/materialize_v26_atomic.py && python v26-runtime/correct_v26_atomic.py
          python v26-runtime/materialize_v26_final_red.py
          python v26-runtime/close_v26_final_gaps.py && python v26-runtime/correct_v26_final_namespace.py
          rm -f v22-runtime/tests/LegalValidator.Tests/V26ProductionSafeAutofixTests.cs v22-runtime/tests/LegalValidator.Tests/V26AtomicExecutionTests.cs
      - name: Locked 143 inventory
        id: baseline
        working-directory: v22-runtime
        run: |
          dotnet restore DocumentEngine.slnx
          dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release | tee /tmp/l
          dotnet test tests/DocumentEngine.Tests/DocumentEngine.Tests.csproj -c Release | tee /tmp/d
          dotnet test tests/SemanticDetector.Tests/SemanticDetector.Tests.csproj -c Release | tee /tmp/s
          grep -Eq 'Passed:[[:space:]]+99' /tmp/l && grep -Eq 'Passed:[[:space:]]+31' /tmp/d && grep -Eq 'Passed:[[:space:]]+13' /tmp/s
          ! grep -E 'Failed:[[:space:]]+[1-9]|Skipped:[[:space:]]+[1-9]' /tmp/l /tmp/d /tmp/s
      - name: Structural RED
        id: structural_red
        continue-on-error: true
        run: |
          python v27-runtime/materialize_v27_structural.py --tests-only
          set -o pipefail
          cd v22-runtime && dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V27StructuralQaTests 2>&1 | tee /tmp/v27-red.log
      - name: Prove structural RED genuine
        id: red_proof
        if: always()
        env:
          STRUCTURAL_RED_OUTCOME: ${{ steps.structural_red.outcome }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          outcome = os.environ.get('STRUCTURAL_RED_OUTCOME', '')
          p = pathlib.Path('/tmp/v27-red.log')
          text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''
          named_contract = re.search(r'StructuralSnapshotter|StructuralQaService|StructuralQaVerdict', text) is not None
          missing_qa_namespace = (
              re.search(r'\bCS0234\b', text) is not None
              and re.search(r"(?:type or namespace name\s+)?['\"]Qa['\"]", text, re.I) is not None
              and re.search(r"namespace\s+['\"]Nd30\.LegalValidator['\"]", text, re.I) is not None
          )
          expected = named_contract or missing_qa_namespace
          infra = re.search(r'NU1301|Unable to load the service index|SDK.*not found|No such file or directory', text, re.I) is not None
          print(f'structural_red_outcome={outcome} expected_missing_contract={expected} infrastructure_failure={infra} log_bytes={len(text.encode("utf-8"))}')
          if outcome != 'failure': sys.exit('Structural RED was not a genuine failed test/build step')
          if not expected: sys.exit('Structural RED log does not identify the intentionally missing V27 QA contract')
          if infra: sys.exit('Structural RED is contaminated by infrastructure failure')
          PY
      - name: Structural GREEN
        id: structural_green
        run: |
          python v27-runtime/materialize_v27_structural.py --production-only
          cd v22-runtime && dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V27StructuralQaTests --logger 'console;verbosity=detailed'
      - name: Release build
        id: build
        working-directory: v22-runtime
        run: dotnet build DocumentEngine.slnx -c Release | tee /tmp/build
      - name: Locked 143 plus structural regression
        id: regression
        working-directory: v22-runtime
        run: |
          dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj --no-build -c Release | tee /tmp/l2
          dotnet test tests/DocumentEngine.Tests/DocumentEngine.Tests.csproj --no-build -c Release | tee /tmp/d2
          dotnet test tests/SemanticDetector.Tests/SemanticDetector.Tests.csproj --no-build -c Release | tee /tmp/s2
          grep -Eq 'Passed:[[:space:]]+106' /tmp/l2 && grep -Eq 'Passed:[[:space:]]+31' /tmp/d2 && grep -Eq 'Passed:[[:space:]]+13' /tmp/s2
          ! grep -E 'Failed:[[:space:]]+[1-9]|Skipped:[[:space:]]+[1-9]' /tmp/l2 /tmp/d2 /tmp/s2
      - name: Structural authority static gate
        id: static
        run: |
          grep -q 'Compare(string source,string output,MutationPlan plan)' v22-runtime/src/LegalValidator/Qa/V27StructuralQa.cs
          ! grep -R -Ei 'StructuralAuthorityPlan|ignore(list|differences)?|whitelist|SaveAs|OpenWrite|WordprocessingDocument.Open\([^,]+,[[:space:]]*true' v22-runtime/src/LegalValidator/Qa
          grep -q 'GetProperty("Operations")' v22-runtime/src/LegalValidator/Qa/V27StructuralQa.cs
          git diff --exit-code f55d82be4657f9da6bee594325d2cccb26c995ff -- v26-runtime v22-runtime/src/LegalValidator/Execution v22-runtime/src/LegalValidator/Authorization v22-runtime/src/LegalValidator/Mutation v22-runtime/src/LegalValidator/Remediation
      - name: Structural enforce before renderer foundation
        if: always()
        run: |
          echo "baseline=${{ steps.baseline.outcome }} red=${{ steps.structural_red.outcome }} proof=${{ steps.red_proof.outcome }} green=${{ steps.structural_green.outcome }} build=${{ steps.build.outcome }} regression=${{ steps.regression.outcome }} static=${{ steps.static.outcome }}"
          test "${{ steps.baseline.outcome }}" = success && test "${{ steps.structural_red.outcome }}" = failure && test "${{ steps.red_proof.outcome }}" = success
          test "${{ steps.structural_green.outcome }}" = success && test "${{ steps.build.outcome }}" = success && test "${{ steps.regression.outcome }}" = success && test "${{ steps.static.outcome }}" = success
      - name: Probe preinstalled renderer
        id: renderer_preprobe
        shell: bash
        run: |
          set -euo pipefail
          renderer="$(command -v soffice || command -v libreoffice || true)"
          if [ -z "$renderer" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'V27_PREINSTALLED_RENDERER=false'
          else
            version="$($renderer --version 2>&1 | head -n 1)"
            echo 'available=true' >> "$GITHUB_OUTPUT"
            printf 'path=%s\nversion=%s\n' "$renderer" "$version" >> "$GITHUB_OUTPUT"
            printf 'V27_PREINSTALLED_RENDERER=true\nV27_RENDERER_PATH=%s\nV27_RENDERER_VERSION=%s\n' "$renderer" "$version"
          fi
      - name: Provision LibreOffice renderer foundation
        if: steps.renderer_preprobe.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          candidate="$(apt-cache policy libreoffice-writer | awk '/Candidate:/ {print $2}')"
          test -n "$candidate" && test "$candidate" != '(none)'
          echo "V27_LIBREOFFICE_CANDIDATE=$candidate"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libreoffice-writer=$candidate"
      - name: Verify renderer foundation
        id: renderer_probe
        shell: bash
        run: |
          set -euo pipefail
          renderer="$(command -v soffice || command -v libreoffice || true)"
          test -n "$renderer"
          version="$($renderer --version 2>&1 | head -n 1)"
          package_version="$(dpkg-query -W -f='${Version}' libreoffice-writer 2>/dev/null || true)"
          printf 'available=true\npath=%s\nversion=%s\npackage_version=%s\n' "$renderer" "$version" "$package_version" >> "$GITHUB_OUTPUT"
          printf 'V27_RENDERER_AVAILABLE=true\nV27_RENDERER_PATH=%s\nV27_RENDERER_VERSION=%s\nV27_LIBREOFFICE_PACKAGE_VERSION=%s\n' "$renderer" "$version" "$package_version"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          "$renderer" --headless --convert-to pdf --outdir "$tmp" v22-runtime/fixtures/v23/02-named-decision.docx 2>&1 | tee /tmp/v27-renderer-smoke.log
          test -s "$tmp/02-named-decision.pdf"
          sha256sum "$tmp/02-named-decision.pdf"
          echo 'V27_RENDERER_SMOKE=PASS'
      - name: Renderer foundation verdict
        run: |
          test "${{ steps.renderer_probe.outputs.available }}" = true
          echo "V27 renderer foundation READY: ${{ steps.renderer_probe.outputs.path }} | ${{ steps.renderer_probe.outputs.version }} | package=${{ steps.renderer_probe.outputs.package_version }}"
          echo 'NEXT: Visual RED -> Visual GREEN -> real-DOCX render/E2E'
