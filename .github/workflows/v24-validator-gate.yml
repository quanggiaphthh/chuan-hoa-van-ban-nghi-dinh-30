name: V24 Legal Validator Runtime Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gd4-v24-validator-runtime
      - feature/gd4-v25-l1-canonical-runtime

permissions:
  contents: write
  issues: write

jobs:
  v24-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize V24 payload once
        if: hashFiles('v25-runtime/canonicalize_v24_payload_once.py') != ''
        run: |
          python v24-runtime/materialize_v24_compact.py
          test "$(grep -c 'using Xunit;' v22-runtime/tests/LegalValidator.Tests/LegalValidatorTests.cs || true)" = "0"
          test "$(grep -c '01-named-decision.docx' v22-runtime/tests/LegalValidator.Tests/LegalValidatorTests.cs)" = "2"
          echo 'RED reproduction PASS: both canonical defects reproduced'
          python v25-runtime/canonicalize_v24_payload_once.py
          rm -rf v22-runtime/src/LegalValidator v22-runtime/tests/LegalValidator.Tests v22-runtime/scripts/v24
          python v24-runtime/materialize_v24_compact.py
          python v24-runtime/assert_v24_canonicalization.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(v25): canonicalize V24 runtime payload'
          git push origin HEAD:feature/gd4-v25-l1-canonical-runtime
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python audit dependencies
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Bootstrap tested V23 source
        working-directory: v22-runtime
        run: |
          python scripts/v23/bootstrap_v23_payload.py
          python scripts/v23/apply_v23_runtime_corrections.py
      - name: Materialize compact V24 validator and verified catalog
        run: python v24-runtime/materialize_v24_compact.py
      - name: V24 canonicalization guard
        run: python v24-runtime/assert_v24_canonicalization.py
      - name: Generate deterministic V22 and V23 fixtures
        working-directory: v22-runtime
        run: |
          python scripts/v22/generate_docx_fixtures.py
          python scripts/v22/normalize_generated_fixtures.py
          python scripts/v23/generate_semantic_fixtures.py
      - name: Static V22 V23 V24 audits
        working-directory: v22-runtime
        run: |
          python scripts/v22/audit_v22_static.py
          python scripts/v23/audit_v23_static.py
          python scripts/v24/audit_v24_static.py
      - name: Restore
        id: restore
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet restore DocumentEngine.slnx
      - name: Build
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet build DocumentEngine.slnx --no-restore -c Release
      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet test DocumentEngine.slnx --no-build -c Release --logger "trx;LogFileName=v24-tests.trx" --logger "console;verbosity=detailed"
      - name: Final static regression
        id: regression
        if: steps.test.outcome == 'success'
        working-directory: v22-runtime
        run: |
          python scripts/v22/audit_v22_static.py
          python scripts/v23/audit_v23_static.py
          python scripts/v24/audit_v24_static.py
      - name: Package tested V24 runtime source
        id: package
        if: steps.test.outcome == 'success'
        working-directory: v22-runtime
        run: |
          rm -rf src/DocumentEngine/bin src/DocumentEngine/obj src/SemanticDetector/bin src/SemanticDetector/obj src/LegalValidator/bin src/LegalValidator/obj
          rm -rf tests/DocumentEngine.Tests/bin tests/DocumentEngine.Tests/obj tests/SemanticDetector.Tests/bin tests/SemanticDetector.Tests/obj tests/LegalValidator.Tests/bin tests/LegalValidator.Tests/obj
          find . -type d -name TestResults -prune -exec rm -rf {} +
          zip -qr ../v24-runtime-tested-source.zip . -x '.v23-payload/*'
          sha256sum ../v24-runtime-tested-source.zip > ../v24-runtime-tested-source.zip.sha256
      - name: Upload V24 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-validator-results
          path: |
            v22-runtime/**/TestResults/**
            v24-runtime-tested-source.zip
            v24-runtime-tested-source.zip.sha256
          if-no-files-found: warn
      - name: Enforce gate
        if: always()
        run: |
          echo "restore=${{ steps.restore.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }} regression=${{ steps.regression.outcome }} package=${{ steps.package.outcome }}"
          test "${{ steps.restore.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.regression.outcome }}" = "success"
          test "${{ steps.package.outcome }}" = "success"
