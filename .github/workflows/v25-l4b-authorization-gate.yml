name: V25 L4B Authorization Gate
on:
  workflow_dispatch:
  push:
    branches: [feature/gd4-v25-l4b-authorization]
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Materialize previous stages through L4A
        run: |
          cd v22-runtime
          python scripts/v23/bootstrap_v23_payload.py
          python scripts/v23/apply_v23_runtime_corrections.py
          cd ..
          python v24-runtime/materialize_v24_compact.py
          python v24-runtime/assert_v24_canonicalization.py
          python v25-runtime/materialize_v25_l2.py
          python v25-runtime/materialize_v25_l3.py
          python v25-runtime/materialize_v25_l4a.py
      - name: Generate deterministic fixtures
        working-directory: v22-runtime
        run: |
          python scripts/v22/generate_docx_fixtures.py
          python scripts/v22/normalize_generated_fixtures.py
          python scripts/v23/generate_semantic_fixtures.py
      - name: Static audits and L4A guards
        working-directory: v22-runtime
        run: |
          python scripts/v22/audit_v22_static.py
          python scripts/v23/audit_v23_static.py
          python scripts/v24/audit_v24_static.py
          python ../v24-runtime/assert_v24_canonicalization.py
          grep -q 'class StaleStateVerifier' src/LegalValidator/State/DocumentState.cs
          ! grep -R -E 'SaveAs|\.Save\(|WriteAll|OpenWrite|FileMode.Create|File\.Replace|File\.Delete|WordprocessingDocument.Open.*true' src/LegalValidator/State
      - name: Materialize L4B RED tests only
        run: python v25-runtime/materialize_v25_l4b.py --tests-only
      - name: Restore for RED
        working-directory: v22-runtime
        run: dotnet restore DocumentEngine.slnx
      - name: Verify L4B RED is real
        id: red
        continue-on-error: true
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj -c Release --filter FullyQualifiedName~V25L4BAuthorizationTests
      - name: Enforce RED
        run: test "${{ steps.red.outcome }}" = "failure"
      - name: Materialize authorization production contract
        run: python v25-runtime/materialize_v25_l4b.py --production-only
      - name: Build
        id: build
        working-directory: v22-runtime
        run: dotnet build DocumentEngine.slnx --no-restore -c Release
      - name: L4B targeted GREEN
        id: targeted
        working-directory: v22-runtime
        run: dotnet test tests/LegalValidator.Tests/LegalValidator.Tests.csproj --no-build -c Release --filter FullyQualifiedName~V25L4BAuthorizationTests --logger "console;verbosity=detailed"
      - name: Full regression
        id: test
        working-directory: v22-runtime
        run: dotnet test DocumentEngine.slnx --no-build -c Release --logger "trx;LogFileName=v25-l4b-tests.trx" --logger "console;verbosity=detailed"
      - name: Static no-write and no-auto-approval gate
        id: regression
        working-directory: v22-runtime
        run: |
          python scripts/v22/audit_v22_static.py
          python scripts/v23/audit_v23_static.py
          python scripts/v24/audit_v24_static.py
          grep -q 'V25L4ADocumentIdentityTests' tests/LegalValidator.Tests/V25L4ADocumentIdentityTests.cs
          grep -q 'V25L4BAuthorizationTests' tests/LegalValidator.Tests/V25L4BAuthorizationTests.cs
          grep -q 'class AuthorizationBoundary' src/LegalValidator/Authorization/AuthorizationBoundary.cs
          grep -q 'AuthorizedMutationRequest' src/LegalValidator/Authorization/AuthorizationBoundary.cs
          grep -q 'Explicit authorization artifact is required' src/LegalValidator/Authorization/AuthorizationBoundary.cs
          ! grep -R -E 'SaveAs|\.Save\(|WriteAll|OpenWrite|FileMode.Create|File\.Replace|File\.Delete|WordprocessingDocument.Open.*true' src/LegalValidator/State src/LegalValidator/Authorization
          ! grep -R -E 'Approved[[:space:]]*=[[:space:]]*true|approve all|auto.?approv' src/LegalValidator/Authorization
      - name: Package tested L4B source
        id: package
        working-directory: v22-runtime
        run: |
          rm -rf src/*/bin src/*/obj tests/*/bin tests/*/obj
          find . -type d -name TestResults -prune -exec rm -rf {} +
          zip -qr ../v25-l4b-runtime-tested-source.zip . -x '.v23-payload/*'
          sha256sum ../v25-l4b-runtime-tested-source.zip > ../v25-l4b-runtime-tested-source.zip.sha256
          sha256sum -c ../v25-l4b-runtime-tested-source.zip.sha256
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25-l4b-authorization-results
          path: |
            v22-runtime/**/TestResults/**
            v25-l4b-runtime-tested-source.zip
            v25-l4b-runtime-tested-source.zip.sha256
          if-no-files-found: warn
      - name: Enforce gate
        if: always()
        run: |
          echo "red=${{ steps.red.outcome }} build=${{ steps.build.outcome }} targeted=${{ steps.targeted.outcome }} test=${{ steps.test.outcome }} regression=${{ steps.regression.outcome }} package=${{ steps.package.outcome }}"
          test "${{ steps.red.outcome }}" = "failure"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.targeted.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.regression.outcome }}" = "success"
          test "${{ steps.package.outcome }}" = "success"
