name: HD05 V25 read-only OOXML source coverage

on:
  push:
    branches: [feature/hd05-v25-ooxml-coverage]
  pull_request:
    paths:
      - 'v22-runtime/src/DocumentEngine/Formatting/PartyParagraphSourceCoverageProbe.cs'
      - 'v22-runtime/src/LegalValidator/Adapters/PartySourceScopedEvidenceSession.cs'
      - 'v22-runtime/tests/LegalValidator.Tests/PartyOoxmlSourceCoverageTests.cs'
      - '.github/workflows/hd05-v25-ooxml-coverage.yml'

permissions:
  contents: read

jobs:
  ooxml-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore v22-runtime/DocumentEngine.slnx
      - name: Build
        run: dotnet build v22-runtime/DocumentEngine.slnx --no-restore -c Release
      - name: Focused V25 source coverage tests
        run: dotnet test v22-runtime/tests/LegalValidator.Tests/LegalValidator.Tests.csproj --no-build -c Release --filter FullyQualifiedName~PartyOoxmlSourceCoverageTests
      - name: Full regression
        run: dotnet test v22-runtime/DocumentEngine.slnx --no-build -c Release
